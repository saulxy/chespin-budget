# Chespin Configuration File

# Wake Word Settings
# Set to false to disable wake word listening (default: true)
wake_word_enabled: true

# Wake word details (must be lowercase)
wake_word: "chespin"

# Path to the downloaded Vosk model folder.
# By default, downloads should be placed under a models/ folder in the project root.
vosk_model_path: "models/vosk-model-small-en-us-0.15"

# Index or name of the audio input device to use.
# Can be an integer index (e.g. 1) or a string name (e.g. "default", "hw:1,0").
# Set to null to use the system default microphone.
audio_device_index: "mic_chespin"

# HDMI Control Settings
# Supported backends: "auto", "gnome", "wlr-randr", "vcgencmd", "mock"
# - "auto": Detects available environment tools (GNOME/Mutter, wlr-randr, vcgencmd, fallback to mock)
# - "gnome": GNOME Mutter DisplayConfig / D-Bus (compatible with Ubuntu 24.04, 26.04, Debian GNOME, Fedora)
# - "wlr-randr": Wayland HDMI control (for modern Pi OS e.g., Bookworm with labwc/wayfire)
# - "vcgencmd": X11/legacy HDMI control
# - "mock": Test mode (logs screen state changes to console without actual hardware calls)
screen_backend: "auto"

# The display output ID to control. Usually HDMI-A-1 or HDMI-1.
# Only used for the wlr-randr backend.
display_output_id: "HDMI-A-1"

# Automatically turn off the screen after X seconds of inactivity.
# Set to null to disable automatic timeout (screen will stay on until manually turned off).
screen_timeout_seconds: 60

# Sound Notification Settings
# WAV sound file to play when the screen turns on.
# The file must be located in the resource folder inside the project folder.
# Set to null or "" to disable sound playback.
screen_on_sound: "wake.wav"

# Hourly Screen Routine Settings
# Automatically turn on the screen at the top of every hour (e.g., 6:00 PM, 7:00 PM)
# Set to false to disable the hourly routine
hourly_routine_enabled: true

# Duration in seconds to keep the screen on during the hourly routine (default: 600 = 10 minutes).
hourly_routine_duration_seconds: 600

# No Disturb Schedule Settings
# Automatically disable wake-up screen activation and wake-up audio during quiet hours.
# Time format: "HH:MM" (24-hour time, e.g. "22:00" to "07:00").
# Set to false to disable the schedule. Can be manually overridden using: python scripts/no_disturb.py [ON|OFF]
no_disturb_enabled: true
no_disturb_start: "22:00"
no_disturb_end: "07:00"


